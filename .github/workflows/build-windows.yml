
name: Build Windows Application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Build executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TicTacToe main.py

      - name: Package executable
        run: |
          Compress-Archive -Path dist/TicTacToe.exe -DestinationPath dist/TicTacToe-Windows-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Windows-x64
          path: dist/TicTacToe-Windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TicTacToe-Windows-x64.zip
