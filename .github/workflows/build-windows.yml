name: Build Windows Application

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Build executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TicTacToe main.py

      - name: Package executable
        run: |
          Compress-Archive -Path dist/TicTacToe.exe -DestinationPath dist/TicTacToe-Windows-x64.zip

      - name: Publish Windows build to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/TicTacToe-Windows-x64.zip
          draft: true
          fail_on_unmatched_files: true